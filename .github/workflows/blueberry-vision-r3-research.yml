name: Blueberry Vision R3 Research

on:
  push:
    branches:
      - research/blueberry-vision-r3-real-image-pilot
    paths:
      - research/blueberry_vision/**
      - docs/research/blueberry-vision-*-r3.md
      - .github/workflows/blueberry-vision-r3-research.yml
  pull_request:
    paths:
      - research/blueberry_vision/**
      - docs/research/blueberry-vision-*-r3.md
      - .github/workflows/blueberry-vision-r3-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueberry-vision-r3-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  r3-offline-acceptance:
    name: R3 offline research / exact head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            research/blueberry_vision/requirements-r2.txt
            research/blueberry_vision/requirements-r3.txt
      - name: Install isolated versioned CPU research dependencies
        run: python -m pip install --disable-pip-version-check -r research/blueberry_vision/requirements-r3.txt
      - name: Record exact head and dependency versions
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: R1 and R2 regressions plus R3 engineering goldens
        run: python -m pytest research/blueberry_vision/tests research/blueberry_vision/newtests -q --junitxml=/tmp/blueberry-r3-tests.xml
      - name: Ruff lint and format
        run: |
          ruff check research/blueberry_vision
          ruff format --check research/blueberry_vision
      - name: Strict research typing
        run: mypy --explicit-package-bases research/blueberry_vision
      - name: Offline R3 engineering acceptance
        run: python -m research.blueberry_vision.r3.cli run-r3-acceptance --output /tmp/blueberry-r3-ci --skip-tests
      - name: Verify original R2 and new R3 artifact seals
        run: |
          python -m research.blueberry_vision.cli verify-artifacts --manifest research/blueberry_vision/artifact_manifest.json
          python -m research.blueberry_vision.r3.cli verify-artifacts --manifest research/blueberry_vision/evidence/r3/artifact_manifest.json --root .
          python -m research.blueberry_vision.r3.cli verify-artifacts --manifest /tmp/blueberry-r3-ci/artifact_manifest.json
      - name: Preserve small synthetic engineering outputs and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueberry-r3-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/blueberry-r3-tests.xml
            /tmp/blueberry-r3-ci/
          if-no-files-found: warn
          retention-days: 14
