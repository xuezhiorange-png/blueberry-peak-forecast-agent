name: Blueberry Vision Research

on:
  push:
    branches:
      - research/blueberry-vision-r2-offline-detection-counting
    paths:
      - research/blueberry_vision/**
      - docs/research/blueberry-vision-*.md
      - .github/workflows/blueberry-vision-research.yml
  pull_request:
    paths:
      - research/blueberry_vision/**
      - docs/research/blueberry-vision-*.md
      - .github/workflows/blueberry-vision-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueberry-vision-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-cpu-research:
    name: Synthetic CPU research / exact head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: research/blueberry_vision/requirements-r2.txt
      - name: Install isolated fixed research dependencies
        run: python -m pip install --disable-pip-version-check -r research/blueberry_vision/requirements-r2.txt
      - name: Record checked out commit and research environment
        run: |
          git rev-parse HEAD
          python --version
          python -m pip freeze
      - name: Research pytest / R1 compatibility / schemas / manual goldens
        run: python -m pytest research/blueberry_vision/tests -q --junitxml=/tmp/blueberry-vision-research-tests.xml
      - name: Ruff lint
        run: ruff check research/blueberry_vision
      - name: Ruff format
        run: ruff format --check research/blueberry_vision
      - name: Strict research typing
        run: mypy --explicit-package-bases research/blueberry_vision
      - name: Complete small CPU synthetic pipeline
        run: python -m research.blueberry_vision.cli run-demo --output /tmp/blueberry-vision-ci-demo --seed 20261013 --images-per-split 4
      - name: Verify committed and generated artifact bytes and canonical hashes
        run: |
          python -m research.blueberry_vision.cli verify-artifacts --manifest research/blueberry_vision/artifact_manifest.json
          python -m research.blueberry_vision.cli verify-artifacts --manifest /tmp/blueberry-vision-ci-demo/artifact_manifest.json
      - name: Preserve synthetic outputs and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-blueberry-vision-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/blueberry-vision-ci-demo/
            /tmp/blueberry-vision-research-tests.xml
          if-no-files-found: warn
          retention-days: 14
