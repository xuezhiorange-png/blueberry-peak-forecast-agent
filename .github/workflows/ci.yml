name: CI

# TASK-011-INFRA Batch 2 implementation.
# Per PR #55 design freeze (docs/task-11-issue-50-batch2-ci-dedup-design.md)
# §3 / §4 / §8.1: 8 PR CI jobs + 1 non-PR full-suite canary, single-execution
# ownership per ci-shard-manifest.yml.
#
# Jobs:
#   PR (pull_request):
#     1. static                   — ruff + mypy (no pytest)
#     2. unit-contract-golden     — pytest -m "not integration and not postgres and not postgres_concurrency"
#     3. postgres-migration       — Alembic migration round-trip
#     4. postgres-domain-1        — integration tests, slice 1
#     5. postgres-domain-2        — integration tests, slice 2
#     6. postgres-task11          — Task 11 evaluation / mask / canonical / hash / key / audit
#     7. postgres-concurrency     — marker-driven @pytest.mark.postgres_concurrency
#     8. compose-smoke            — Docker Compose smoke (no pytest)
#   Non-PR (push / schedule / workflow_dispatch):
#     9. full-suite-canary        — full pytest on main push / schedule / dispatch ONLY
#
# PR CI MUST NOT include full-suite pytest (per design §3.2 / §4).
# `if: github.event_name == 'pull_request'` on PR jobs and `!= 'pull_request'`
# on canary enforces the split.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly at 03:30 UTC (placeholder cron per PR #55 §14 open question 1).
    - cron: "30 3 * * *"
  workflow_dispatch:

# Cancel in-progress runs of the same workflow when a new commit lands.
# Per Batch 6 (Issue #54 item 3) — the group key MUST be the PR head
# ref when one exists (so PR pushes cancel sibling PR pushes on the
# same head branch only) and MUST fall back to the run SHA for main
# pushes / schedule / dispatch (so main push full-suite-canary is NOT
# cancelled by an unrelated PR run that happens to share a workflow
# invocation, and vice-versa).
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # §3 row 1 — static (PR only, no pytest)
  # ----------------------------------------------------------------
  static:
    name: static
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Batch 6 (Issue #54 item 1) — pip dependency cache. The cache
          # key is keyed on Python version (so 3.11/3.13 jobs do not
          # collide) and the project lock + constraints file hashes (so
          # adding/removing a dep invalidates the cache automatically).
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            backend/constraints-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          # Batch 6 (Issue #54 item 2) — pin direct deps via
          # ``backend/constraints-ci.txt`` so CI is reproducible across
          # PRs. The constraints file holds the same dep set as
          # pyproject.toml with exact ``==`` pins; transitive deps are
          # resolved by pip and locked indirectly by the direct pins.
          pip install --disable-pip-version-check --quiet \
            -c backend/constraints-ci.txt -e ".[dev]"

      # Batch 6 (Issue #54 item 8) — runner / PostgreSQL worker identity
      # log. Surfaces runner host, container host, current_database(),
      # current_user(), and the worker_index (job / run_id / attempt /
      # sha) in the step summary for failure triage. ``|| true`` ensures
      # this step NEVER fails the workflow — a connection problem
      # degrades to "current_database: unavailable" via the helper itself.
      # For non-postgres jobs (static, unit-contract-golden,
      # compose-smoke) the PG fields gracefully show "unavailable"
      # while runner / worker_index are still useful for triage.
      - name: Log worker / database identity
        if: always()
        run: |
          python scripts/ci/log_worker_identity.py \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy backend/app

  # ----------------------------------------------------------------
  # §3 row 2 — unit-contract-golden (PR only)
  # Marker-residual: catches everything NOT marked
  # integration/postgres/postgres_concurrency and NOT covered by a path-grep shard.
  # ----------------------------------------------------------------
  unit-contract-golden:
    name: unit-contract-golden
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Batch 6 (Issue #54 item 1) — pip dependency cache. The cache
          # key is keyed on Python version (so 3.11/3.13 jobs do not
          # collide) and the project lock + constraints file hashes (so
          # adding/removing a dep invalidates the cache automatically).
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            backend/constraints-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          # Batch 6 (Issue #54 item 2) — pin direct deps via
          # ``backend/constraints-ci.txt`` so CI is reproducible across
          # PRs. The constraints file holds the same dep set as
          # pyproject.toml with exact ``==`` pins; transitive deps are
          # resolved by pip and locked indirectly by the direct pins.
          pip install --disable-pip-version-check --quiet \
            -c backend/constraints-ci.txt -e ".[dev]"

      # Batch 6 (Issue #54 item 8) — runner / PostgreSQL worker identity
      # log. Surfaces runner host, container host, current_database(),
      # current_user(), and the worker_index (job / run_id / attempt /
      # sha) in the step summary for failure triage. ``|| true`` ensures
      # this step NEVER fails the workflow — a connection problem
      # degrades to "current_database: unavailable" via the helper itself.
      # For non-postgres jobs (static, unit-contract-golden,
      # compose-smoke) the PG fields gracefully show "unavailable"
      # while runner / worker_index are still useful for triage.
      - name: Log worker / database identity
        if: always()
        run: |
          python scripts/ci/log_worker_identity.py \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Unit / contract / golden tests
        env:
          APP_ENV: test
        run: |
          mkdir -p reports/test-results
          set +e
          # Batch 6 (Issue #54 items 5 + 7) — emit top-30 slowest tests
          # for triage, and echo the deterministic CI seed marker (the
          # project does not currently use a randomized-order plugin,
          # so this is a CI-visible traceability log line only — no
          # ordering change).
          echo "PYTEST_CI_SEED=${PYTEST_CI_SEED:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          pytest -m "not integration and not postgres and not postgres_concurrency" -q \
            --tb=short \
            --durations=30 \
            --junitxml=reports/test-results/unit-contract-golden.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f reports/test-results/unit-contract-golden.xml ]; then
            echo "::group::unit-contract-golden JUnit XML"
            cat reports/test-results/unit-contract-golden.xml
            echo "::endgroup::"
          fi
          exit "$status"

      # Batch 6 (Issue #54 item 6) — failed pytest nodeid summary.
      # Runs after pytest (with ``if: always()``) and never fails the
      # workflow: parser failure is caught by ``|| true`` and surfaces
      # as "no JUnit XML found" / "no failed nodeids reported" in the
      # step summary, never as a workflow failure.
      - name: Failed nodeid summary
        if: always()
        run: |
          python scripts/ci/parse_junit_failures.py \
            --xml reports/test-results/${{ github.job }}.xml \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload unit-contract-golden JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-contract-golden-results
          path: reports/test-results/unit-contract-golden.xml
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # §3 row 3 — postgres-migration (PR only)
  # Alembic upgrade/downgrade round-trip across all migrations.
  # ----------------------------------------------------------------
  postgres-migration:
    name: postgres-migration
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry_app -d blueberry_peak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Slice 3 — postgres-migration isolated DB profile. The destructive
      # Alembic round-trip (upgrade head → downgrade 0010 → upgrade head)
      # is bound to a per-run isolated database whose name is fail-closed
      # validated by backend/tests/migration_isolation_helpers.py. The
      # service container's own ``blueberry_peak`` is only used as the
      # admin / "postgres" connection target (to create + drop the
      # isolated database) and is never the target of any alembic
      # upgrade / downgrade / pytest run.
      ISOLATED_JOB_NAME: postgres_migration
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: blueberry_app
      POSTGRES_PASSWORD: change-me-in-local-env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Batch 6 (Issue #54 item 1) — pip dependency cache. The cache
          # key is keyed on Python version (so 3.11/3.13 jobs do not
          # collide) and the project lock + constraints file hashes (so
          # adding/removing a dep invalidates the cache automatically).
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            backend/constraints-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          # Batch 6 (Issue #54 item 2) — pin direct deps via
          # ``backend/constraints-ci.txt`` so CI is reproducible across
          # PRs. The constraints file holds the same dep set as
          # pyproject.toml with exact ``==`` pins; transitive deps are
          # resolved by pip and locked indirectly by the direct pins.
          pip install --disable-pip-version-check --quiet \
            -c backend/constraints-ci.txt -e ".[dev]"

      # Batch 6 (Issue #54 item 8) — runner / PostgreSQL worker identity
      # log. Surfaces runner host, container host, current_database(),
      # current_user(), and the worker_index (job / run_id / attempt /
      # sha) in the step summary for failure triage. ``|| true`` ensures
      # this step NEVER fails the workflow — a connection problem
      # degrades to "current_database: unavailable" via the helper itself.
      # For non-postgres jobs (static, unit-contract-golden,
      # compose-smoke) the PG fields gracefully show "unavailable"
      # while runner / worker_index are still useful for triage.
      - name: Log worker / database identity
        if: always()
        run: |
          python scripts/ci/log_worker_identity.py \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Wait for PostgreSQL service
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main() -> None:
              last_error: Exception | None = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(
                          host=os.environ["POSTGRES_HOST"],
                          port=int(os.environ["POSTGRES_PORT"]),
                          database=os.environ["POSTGRES_DB"],
                          user=os.environ["POSTGRES_USER"],
                          password=os.environ["POSTGRES_PASSWORD"],
                      )
                      value = await conn.fetchval("SELECT 1")
                      await conn.close()
                      if value == 1:
                          return
                  except Exception as exc:
                      last_error = exc
                      await asyncio.sleep(1)
              raise SystemExit(f"PostgreSQL service was not ready: {last_error}")

          asyncio.run(main())
          PY

      - name: Resolve isolated test database name
        # Slice 3: derive a per-run isolated DB name and run the
        # fail-closed guard so the rest of the job binds to a name
        # that is unique, recognizably a test database, and not on
        # the FORBIDDEN_DATABASE_NAMES list.
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import sys

          from backend.tests.migration_isolation_helpers import (
              assert_safe_isolated_db_name,
              resolve_isolated_db_name,
          )

          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          job_name = os.environ["ISOLATED_JOB_NAME"]
          name = resolve_isolated_db_name(run_id, run_attempt, job_name)
          assert_safe_isolated_db_name(name)
          print(f"ISOLATED_DB_NAME={name}")
          PY

      - name: Create isolated test database
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          ISOLATED_DB_NAME = os.environ["ISOLATED_DB_NAME"]

          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  # Defensive: do not silently overwrite an existing
                  # database. If we see one, fail the step loudly so
                  # the operator can investigate naming collisions
                  # before we reuse a stale schema.
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1",
                      ISOLATED_DB_NAME,
                  )
                  if exists:
                      raise SystemExit(
                          f"isolated test database {ISOLATED_DB_NAME!r} "
                          "already exists; refusing to overwrite"
                      )
                  await conn.execute(
                      f'CREATE DATABASE "{ISOLATED_DB_NAME}"'
                  )
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Alembic harvest-state persistence migration round trip
        # Bound to the isolated database so the destructive downgrade
        # never reaches the dev-like ``blueberry_peak`` service DB.
        env:
          APP_ENV: test
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.ISOLATED_DB_NAME }}
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini downgrade 0010_harvest_state_persistence
          alembic -c backend/alembic.ini upgrade head

      - name: Postgres migration tests
        env:
          APP_ENV: test
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.ISOLATED_DB_NAME }}
        run: |
          mkdir -p reports/test-results
          set +e
          # Batch 6 (Issue #54 items 5 + 7) — emit top-30 slowest tests
          # and echo the deterministic CI seed marker.
          echo "PYTEST_CI_SEED=${PYTEST_CI_SEED:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          pytest \
            backend/tests/test_alembic_baseline.py \
            backend/tests/test_harvest_state_alembic.py \
            backend/tests/test_residual_model_alembic.py \
            backend/tests/test_alembic_round_trip_isolated.py \
            backend/tests/test_alembic_round_trip_isolated_db_live.py \
            backend/tests/test_core_forecast_alembic.py \
            backend/tests/test_historical_backtest_alembic.py \
            backend/tests/forecast_quality/test_persistence.py \
            -q --tb=long \
            --durations=30 \
            --junitxml=reports/test-results/postgres-migration.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f reports/test-results/postgres-migration.xml ]; then
            echo "::group::postgres-migration JUnit XML"
            cat reports/test-results/postgres-migration.xml
            echo "::endgroup::"
          fi
          exit "$status"

      # Batch 6 (Issue #54 item 6) — failed pytest nodeid summary.
      # Runs after pytest (with ``if: always()``) and never fails the
      # workflow: parser failure is caught by ``|| true`` and surfaces
      # as "no JUnit XML found" / "no failed nodeids reported" in the
      # step summary, never as a workflow failure.
      - name: Failed nodeid summary
        if: always()
        run: |
          python scripts/ci/parse_junit_failures.py \
            --xml reports/test-results/${{ github.job }}.xml \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload postgres-migration JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-migration-results
          path: reports/test-results/postgres-migration.xml
          if-no-files-found: warn

      - name: Drop isolated test database
        # Cleanup is best-effort: a DROP failure must NEVER mask a
        # pre-existing failure in the migration steps. The step is
        # `if: always()` and wraps DROP in `pg_terminate_backend` to
        # release any leaked connection, then `::warning::` on failure
        # so the run still reports the upstream exit code.
        if: always()
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          set +e
          python - <<'PY'
          import asyncio
          import os
          import sys

          import asyncpg

          ISOLATED_DB_NAME = os.environ["ISOLATED_DB_NAME"]

          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  # Terminate any active backends on the isolated DB so
                  # DROP can acquire ACCESS EXCLUSIVE.
                  await conn.execute(
                      "SELECT pg_terminate_backend(pid) "
                      "FROM pg_stat_activity "
                      "WHERE datname = $1 AND pid <> pg_backend_pid()",
                      ISOLATED_DB_NAME,
                  )
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1",
                      ISOLATED_DB_NAME,
                  )
                  if not exists:
                      print(
                          f"isolated test database {ISOLATED_DB_NAME!r} "
                          "does not exist; nothing to drop"
                      )
                      return
                  await conn.execute(
                      f'DROP DATABASE "{ISOLATED_DB_NAME}"'
                  )
                  print(
                      f"dropped isolated test database {ISOLATED_DB_NAME!r}"
                  )
              finally:
                  await conn.close()

          try:
              asyncio.run(main())
          except Exception as exc:  # noqa: BLE001
              print(
                  f"::warning::failed to drop isolated test database "
                  f"{ISOLATED_DB_NAME!r}: {exc}"
              )
              sys.exit(0)
          PY
  # ----------------------------------------------------------------
  # §3 row 4 — postgres-domain-1 (PR only)
  # Integration domain tests, slice 1.
  # ----------------------------------------------------------------
  postgres-domain-1:
    name: postgres-domain-1
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      ISOLATED_JOB_NAME: postgres-domain-1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry_app -d blueberry_peak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Batch 6 (Issue #54 item 1) — pip dependency cache. The cache
          # key is keyed on Python version (so 3.11/3.13 jobs do not
          # collide) and the project lock + constraints file hashes (so
          # adding/removing a dep invalidates the cache automatically).
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            backend/constraints-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          # Batch 6 (Issue #54 item 2) — pin direct deps via
          # ``backend/constraints-ci.txt`` so CI is reproducible across
          # PRs. The constraints file holds the same dep set as
          # pyproject.toml with exact ``==`` pins; transitive deps are
          # resolved by pip and locked indirectly by the direct pins.
          pip install --disable-pip-version-check --quiet \
            -c backend/constraints-ci.txt -e ".[dev]"

      # Batch 6 (Issue #54 item 8) — runner / PostgreSQL worker identity
      # log. Surfaces runner host, container host, current_database(),
      # current_user(), and the worker_index (job / run_id / attempt /
      # sha) in the step summary for failure triage. ``|| true`` ensures
      # this step NEVER fails the workflow — a connection problem
      # degrades to "current_database: unavailable" via the helper itself.
      # For non-postgres jobs (static, unit-contract-golden,
      # compose-smoke) the PG fields gracefully show "unavailable"
      # while runner / worker_index are still useful for triage.
      - name: Log worker / database identity
        if: always()
        run: |
          python scripts/ci/log_worker_identity.py \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Wait for PostgreSQL service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main() -> None:
              last_error = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(
                          host=os.environ["POSTGRES_HOST"],
                          port=int(os.environ["POSTGRES_PORT"]),
                          database=os.environ["POSTGRES_DB"],
                          user=os.environ["POSTGRES_USER"],
                          password=os.environ["POSTGRES_PASSWORD"],
                      )
                      v = await conn.fetchval("SELECT 1"); await conn.close()
                      if v == 1: return
                  except Exception as e:
                      last_error = e; await asyncio.sleep(1)
              raise SystemExit(f"PG not ready: {last_error}")
          asyncio.run(main())
          PY

      - name: Resolve isolated test database name
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os

          from backend.tests.migration_isolation_helpers import (
              assert_safe_isolated_db_name,
              resolve_isolated_db_name,
          )

          name = resolve_isolated_db_name(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
              os.environ["ISOLATED_JOB_NAME"],
          )
          assert_safe_isolated_db_name(name)
          print(f"ISOLATED_DB_NAME={name}")
          PY

      - name: Create isolated test database
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  name = os.environ["ISOLATED_DB_NAME"]
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1", name
                  )
                  if exists:
                      raise SystemExit(f"isolated database already exists: {name!r}")
                  await conn.execute(f'CREATE DATABASE "{name}"')
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Alembic upgrade head
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:55432/${{ env.ISOLATED_DB_NAME }}
        run: alembic -c backend/alembic.ini upgrade head

      - name: Postgres domain-1 tests
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
