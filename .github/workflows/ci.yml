      - name: Upload postgres-task11 JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-task11-results
          path: reports/test-results/postgres-task11.xml
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # §3 row 7 — postgres-concurrency (PR only)
  # Marker-driven: @pytest.mark.postgres_concurrency (sharp selector).
  # ----------------------------------------------------------------
  postgres-concurrency:
    name: postgres-concurrency
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry_app -d blueberry_peak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          pip install --disable-pip-version-check --quiet -e ".[dev]"

      - name: Wait for PostgreSQL service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main() -> None:
              last_error = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(
                          host=os.environ["POSTGRES_HOST"],
                          port=int(os.environ["POSTGRES_PORT"]),
                          database=os.environ["POSTGRES_DB"],
                          user=os.environ["POSTGRES_USER"],
                          password=os.environ["POSTGRES_PASSWORD"],
                      )
                      v = await conn.fetchval("SELECT 1"); await conn.close()
                      if v == 1: return
                  except Exception as e:
                      last_error = e; await asyncio.sleep(1)
              raise SystemExit(f"PG not ready: {last_error}")
          asyncio.run(main())
          PY

      - name: Alembic upgrade head
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: alembic -c backend/alembic.ini upgrade head

      - name: Postgres concurrency tests
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          mkdir -p reports/test-results
          set +e
          pytest -m postgres_concurrency -q --tb=long \
            --timeout=180 \
            --timeout-method=signal \
            --durations=0 \
            --junitxml=reports/test-results/postgres-concurrency.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f reports/test-results/postgres-concurrency.xml ]; then
            echo "::group::postgres-concurrency JUnit XML"
            cat reports/test-results/postgres-concurrency.xml
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload postgres-concurrency JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-results
          path: reports/test-results/postgres-concurrency.xml
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # §3 row 8 — compose-smoke (PR only, no pytest)
  # ----------------------------------------------------------------
  compose-smoke:
    name: compose-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose config

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up -d db

      - name: Wait for Compose PostgreSQL health
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q db)")"
            echo "db health: ${status}"
            if [ "${status}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Check container status
        run: docker compose ps

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

