                  try:
                      conn = await asyncpg.connect(
                          host=os.environ["POSTGRES_HOST"],
                          port=int(os.environ["POSTGRES_PORT"]),
                          database=os.environ["POSTGRES_DB"],
                          user=os.environ["POSTGRES_USER"],
                          password=os.environ["POSTGRES_PASSWORD"],
                      )
                      value = await conn.fetchval("SELECT 1")
                      await conn.close()
                      if value == 1:
                          return
                  except Exception as exc:
                      last_error = exc
                      await asyncio.sleep(1)
              raise SystemExit(f"PostgreSQL service was not ready: {last_error}")

          asyncio.run(main())
          PY

      - name: Resolve isolated test database name
        # Slice 4: derive a per-run isolated DB name and run the
        # fail-closed guard so the rest of the job binds to a name
        # that is unique, recognizably a test database, and not on
        # the FORBIDDEN_DATABASE_NAMES list. The wrapper routes
        # through the Slice 3 helper which routes through the
        # Slice 1 dev-DB safeguard.
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import sys

          from backend.tests.concurrency_isolation_helpers import (
              assert_safe_concurrency_isolated_db_name,
              resolve_concurrency_isolated_db_name,
          )

          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          job_name = os.environ["ISOLATED_JOB_NAME"]
          name = resolve_concurrency_isolated_db_name(run_id, run_attempt)
          assert_safe_concurrency_isolated_db_name(name)
          print(f"ISOLATED_DB_NAME={name}")
          print(f"ISOLATED_DB_NAME matches slice-3 template: {name.startswith('blueberry_peak_test_')}", file=sys.stderr)
          PY

      - name: Create isolated test database
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          ISOLATED_DB_NAME = os.environ["ISOLATED_DB_NAME"]

          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  # Defensive: do not silently overwrite an existing
                  # database. If we see one, fail the step loudly so
                  # the operator can investigate naming collisions
                  # before we reuse a stale schema.
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1",
                      ISOLATED_DB_NAME,
                  )
                  if exists:
                      raise SystemExit(
                          f"isolated test database {ISOLATED_DB_NAME!r} "
                          "already exists; refusing to overwrite"
                      )
                  await conn.execute(
                      f'CREATE DATABASE "{ISOLATED_DB_NAME}"'
                  )
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Alembic upgrade head against isolated database
        # Bound to the isolated database so the destructive CI
        # pipeline never reaches the dev-like ``blueberry_peak``
        # service DB. The alembic upgrade is read-mostly here (no
        # downgrade); Slice 3's destructive round-trip stays in the
        # ``postgres-migration`` job.
        env:
          APP_ENV: test
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.ISOLATED_DB_NAME }}
        run: alembic -c backend/alembic.ini upgrade head

      - name: Postgres concurrency tests
        # Concurrency / real-commit tests against the isolated DB.
        # The marker selector (-m postgres_concurrency) is preserved
        # so the behavioural tests in test_task11_dependency_serialization
        # and test_task9_authority_repository_postgres are picked up.
        # The new contract-test file
        # (backend/tests/test_concurrency_isolation_helpers.py) and
        # the live companion
        # (backend/tests/test_concurrency_isolation_helpers_live.py)
        # are also marked ``postgres`` / ``postgres_concurrency`` and
        # are listed explicitly so the marker selector is
        # deterministic across shards.
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:${{ env.POSTGRES_PORT }}/${{ env.ISOLATED_DB_NAME }}
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          mkdir -p reports/test-results
          set +e
          # Batch 6 (Issue #54 items 5 + 7) — emit top-30 slowest tests
          # and echo the deterministic CI seed marker. ``--durations=30``
          # is appended to each pytest invocation in the same job below.
          echo "PYTEST_CI_SEED=${PYTEST_CI_SEED:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          pytest \
            backend/tests/test_concurrency_isolation_helpers.py \
            backend/tests/test_concurrency_isolation_helpers_live.py \
            backend/tests/rolling_backtest/test_historical_backtest_concurrency.py \
            backend/tests/forecast_quality/test_idempotency.py \
            -m postgres_concurrency -q --tb=long \
            --timeout=180 \
            --timeout-method=signal \
            --durations=30 \
            --junitxml=reports/test-results/postgres-concurrency.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f reports/test-results/postgres-concurrency.xml ]; then
            echo "::group::postgres-concurrency JUnit XML"
            cat reports/test-results/postgres-concurrency.xml
            echo "::endgroup::"
          fi
          exit "$status"

      # Batch 6 (Issue #54 item 6) — failed pytest nodeid summary.
      # Runs after pytest (with ``if: always()``) and never fails the
      # workflow: parser failure is caught by ``|| true`` and surfaces
      # as "no JUnit XML found" / "no failed nodeids reported" in the
      # step summary, never as a workflow failure.
      - name: Failed nodeid summary
        if: always()
        run: |
          python scripts/ci/parse_junit_failures.py \
            --xml reports/test-results/${{ github.job }}.xml \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload postgres-concurrency JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-concurrency-results
          path: reports/test-results/postgres-concurrency.xml
          if-no-files-found: warn

      - name: Drop isolated test database
        # Cleanup is best-effort: a DROP failure must NEVER mask a
        # pre-existing failure in the concurrency tests. The step is
        # `if: always()` and wraps DROP in `pg_terminate_backend` to
        # release any leaked connection, then `::warning::` on failure
        # so the run still reports the upstream exit code.
        if: always()
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          set +e
          python - <<'PY'
          import asyncio
          import os
          import sys

          import asyncpg

          ISOLATED_DB_NAME = os.environ["ISOLATED_DB_NAME"]

          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  # Terminate any active backends on the isolated DB so
                  # DROP can acquire ACCESS EXCLUSIVE.
                  await conn.execute(
                      "SELECT pg_terminate_backend(pid) "
                      "FROM pg_stat_activity "
                      "WHERE datname = $1 AND pid <> pg_backend_pid()",
                      ISOLATED_DB_NAME,
                  )
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1",
                      ISOLATED_DB_NAME,
                  )
                  if not exists:
                      print(
                          f"isolated test database {ISOLATED_DB_NAME!r} "
                          "does not exist; nothing to drop"
                      )
                      return
                  await conn.execute(
                      f'DROP DATABASE "{ISOLATED_DB_NAME}"'
                  )
                  print(
                      f"dropped isolated test database {ISOLATED_DB_NAME!r}"
                  )
              finally:
                  await conn.close()

          try:
              asyncio.run(main())
          except Exception as exc:  # noqa: BLE001
              print(
                  f"::warning::failed to drop isolated test database "
                  f"{ISOLATED_DB_NAME!r}: {exc}"
              )
              sys.exit(0)
          PY

  # ----------------------------------------------------------------
  # §3 row 8 — compose-smoke (PR only, no pytest)
  # ----------------------------------------------------------------
  compose-smoke:
    name: compose-smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose config

      - name: Start PostgreSQL with Docker Compose
        run: docker compose up -d db

      - name: Wait for Compose PostgreSQL health
        run: |
          for i in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q db)")"
            echo "db health: ${status}"
            if [ "${status}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Check container status
        run: docker compose ps

      - name: Stop Docker Compose
        if: always()
        run: docker compose down -v

  # ----------------------------------------------------------------
  # §4 — full-suite-canary (NOT pull_request)
  # Push / schedule / dispatch ONLY. Runs the full pytest suite.
  # ----------------------------------------------------------------
  full-suite-canary:
    name: full-suite-canary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ISOLATED_JOB_NAME: full-suite-canary
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry_app -d blueberry_peak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Batch 6 (Issue #54 item 1) — pip dependency cache. The cache
          # key is keyed on Python version (so 3.11/3.13 jobs do not
          # collide) and the project lock + constraints file hashes (so
          # adding/removing a dep invalidates the cache automatically).
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            backend/constraints-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          # Batch 6 (Issue #54 item 2) — pin direct deps via
          # ``backend/constraints-ci.txt`` so CI is reproducible across
          # PRs. The constraints file holds the same dep set as
          # pyproject.toml with exact ``==`` pins; transitive deps are
          # resolved by pip and locked indirectly by the direct pins.
          pip install --disable-pip-version-check --quiet \
            -c backend/constraints-ci.txt -e ".[dev]"

      # Batch 6 (Issue #54 item 8) — runner / PostgreSQL worker identity
      # log. Surfaces runner host, container host, current_database(),
      # current_user(), and the worker_index (job / run_id / attempt /
      # sha) in the step summary for failure triage. ``|| true`` ensures
      # this step NEVER fails the workflow — a connection problem
      # degrades to "current_database: unavailable" via the helper itself.
      # For non-postgres jobs (static, unit-contract-golden,
      # compose-smoke) the PG fields gracefully show "unavailable"
      # while runner / worker_index are still useful for triage.
      - name: Log worker / database identity
        if: always()
        run: |
          python scripts/ci/log_worker_identity.py \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Wait for PostgreSQL service
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          async def main() -> None:
              last_error = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(
                          host=os.environ["POSTGRES_HOST"],
                          port=int(os.environ["POSTGRES_PORT"]),
                          database=os.environ["POSTGRES_DB"],
                          user=os.environ["POSTGRES_USER"],
                          password=os.environ["POSTGRES_PASSWORD"],
                      )
                      v = await conn.fetchval("SELECT 1"); await conn.close()
                      if v == 1: return
                  except Exception as e:
                      last_error = e; await asyncio.sleep(1)
              raise SystemExit(f"PG not ready: {last_error}")
          asyncio.run(main())
          PY

      - name: Resolve isolated test database name
        env:
          POSTGRES_DB: blueberry_peak
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os

          from backend.tests.migration_isolation_helpers import (
              assert_safe_isolated_db_name,
              resolve_isolated_db_name,
          )

          name = resolve_isolated_db_name(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
              os.environ["ISOLATED_JOB_NAME"],
          )
          assert_safe_isolated_db_name(name)
          print(f"ISOLATED_DB_NAME={name}")
          PY

      - name: Create isolated test database
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main() -> None:
              name = os.environ["ISOLATED_DB_NAME"]
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database=os.environ["POSTGRES_DB"],
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1", name
                  )
                  if exists:
                      raise SystemExit(
                          f"isolated test database {name!r} already exists; "
                          "refusing to overwrite"
                      )
                  await conn.execute(f'CREATE DATABASE "{name}"')
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Validate isolated PostgreSQL test identity
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:55432/${{ env.ISOLATED_DB_NAME }}
        run: |
          python - <<'PY'
          from backend.tests.db.profile import assert_safe_postgres_test_identity

          identity = assert_safe_postgres_test_identity(env=None)
          print(
              "validated isolated PostgreSQL test identity: "
              f"database={identity.database_name!r} port={identity.port}"
          )
          PY

      - name: Alembic upgrade head
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:55432/${{ env.ISOLATED_DB_NAME }}
        run: alembic -c backend/alembic.ini upgrade head

      - name: Full pytest suite
        env:
          APP_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:55432/${{ env.ISOLATED_DB_NAME }}
          RUN_POSTGRES_INTEGRATION: "1"
        run: |
          mkdir -p reports/test-results
          set +e
          # Batch 6 (Issue #54 items 5 + 7) — emit top-30 slowest tests
          # and echo the deterministic CI seed marker.
          echo "PYTEST_CI_SEED=${PYTEST_CI_SEED:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          pytest -q --tb=long \
            --durations=30 \
            --junitxml=reports/test-results/full.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f reports/test-results/full.xml ]; then
            echo "::group::Full pytest JUnit XML"
            cat reports/test-results/full.xml
            echo "::endgroup::"
          fi
          exit "$status"

      # Batch 6 (Issue #54 item 6) — failed pytest nodeid summary.
      # The full-suite-canary job uses ``reports/test-results/full.xml``
      # (historical name from PR #55), not the conventional
      # ``<job-name>.xml`` pattern. Hard-code the explicit path so
      # the parser finds the right JUnit artifact.
      - name: Failed nodeid summary
        if: always()
        run: |
          python scripts/ci/parse_junit_failures.py \
            --xml reports/test-results/full.xml \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload full pytest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-canary-results
          path: reports/test-results/full.xml
          if-no-files-found: warn

      - name: Drop isolated test database
        if: always()
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          set +e
          python - <<'PY'
          import asyncio
          import os
          import sys

          import asyncpg
          from backend.tests.migration_isolation_helpers import (
              assert_safe_isolated_db_name,
              resolve_isolated_db_name,
          )

          def resolve_verified_cleanup_name() -> str | None:
              try:
                  job_name = os.environ.get("ISOLATED_JOB_NAME")
                  if job_name != "full-suite-canary":
                      print(
                          "::warning::unexpected full-suite cleanup job identity; "
                          "refusing database mutation"
                      )
                      return None
                  expected_name = resolve_isolated_db_name(
                      os.environ["GITHUB_RUN_ID"],
                      os.environ["GITHUB_RUN_ATTEMPT"],
                      job_name,
                  )
                  assert_safe_isolated_db_name(expected_name)
              except Exception as exc:
                  print(
                      "::warning::failed to resolve safe cleanup identity: "
                      f"{exc}"
                  )
                  return None

              propagated_name = os.environ.get("ISOLATED_DB_NAME")
              if not propagated_name:
                  print("::warning::isolated database name was not propagated")
                  return None
              if propagated_name != expected_name:
                  print(
                      "::warning::isolated database cleanup identity mismatch; "
                      "refusing database mutation"
                  )
                  return None
              return expected_name

          expected_name = resolve_verified_cleanup_name()

          async def main() -> None:
              if not expected_name:
                  print("::warning::isolated database name was not resolved")
                  return
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database=os.environ["POSTGRES_DB"],
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  await conn.execute(
                      "SELECT pg_terminate_backend(pid) "
                      "FROM pg_stat_activity "
                      "WHERE datname = $1 AND pid <> pg_backend_pid()",
                      expected_name,
                  )
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1",
                      expected_name,
                  )
                  if exists:
                      await conn.execute(f'DROP DATABASE "{expected_name}"')
                      print(f"dropped isolated test database {expected_name!r}")
                  else:
                      print(
                          f"isolated test database {expected_name!r} was already absent"
                      )
              finally:
                  await conn.close()

          try:
              asyncio.run(main())
          except Exception as exc:
              print(f"::warning::failed to drop isolated test database: {exc}")
          sys.exit(0)
          PY

  # ----------------------------------------------------------------
  # Round B additive frontend validation. These jobs do not alter the
  # Python/PostgreSQL shard selectors or pytest ownership above.
  # ----------------------------------------------------------------
  frontend-static:
    name: frontend-static
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select pinned npm runtime
        run: |
          npm install --global npm@11.12.1 --no-audit --no-fund
          node --version
          npm --version
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Format check
        run: npm --prefix frontend run format:check
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Build
        run: npm --prefix frontend run build
      - name: Upload frontend dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-dist
          path: frontend/dist
          if-no-files-found: warn

  frontend-unit:
    name: frontend-unit
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select pinned npm runtime
        run: |
          npm install --global npm@11.12.1 --no-audit --no-fund
          node --version
          npm --version
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Unit tests
        run: |
          mkdir -p frontend/reports/test-results
          npm --prefix frontend run test:unit -- \
            --run --reporter=junit \
            --outputFile=reports/test-results/frontend-unit.xml
      - name: Upload frontend unit JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-results
          path: frontend/reports/test-results/frontend-unit.xml
          if-no-files-found: warn

  frontend-e2e:
    name: frontend-e2e
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blueberry_peak
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueberry_app -d blueberry_peak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      ISOLATED_JOB_NAME: frontend_e2e
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: blueberry_app
      POSTGRES_PASSWORD: change-me-in-local-env
      POSTGRES_DB: blueberry_peak
      TRIAL_ACTOR_IDENTITY: actor:postgres-default-trial
      TRIAL_ACTOR_ALLOWED_SOURCE_SYSTEMS: trial-api
      TRIAL_ACTOR_ALLOWED_CHANNELS: api,csv,xlsx
      TRIAL_ACTOR_PERMISSIONS: >-
        may_create,may_append,may_preview,may_validate,may_commit,
        may_read_forecast_authority,may_create_forecast,may_read_forecast,
        may_export_forecast,may_create_quality,may_read_quality,
        may_read_quality_comparison,may_export_quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/constraints-ci.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade --quiet pip
          pip install --disable-pip-version-check --quiet \
            -c backend/constraints-ci.txt -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select pinned npm runtime
        run: |
          npm install --global npm@11.12.1 --no-audit --no-fund
          node --version
          npm --version
      - name: Wait for PostgreSQL service
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main() -> None:
              last_error: Exception | None = None
              for _ in range(30):
                  try:
                      conn = await asyncpg.connect(
                          host=os.environ["POSTGRES_HOST"],
                          port=int(os.environ["POSTGRES_PORT"]),
                          database=os.environ["POSTGRES_DB"],
                          user=os.environ["POSTGRES_USER"],
                          password=os.environ["POSTGRES_PASSWORD"],
                      )
                      if await conn.fetchval("SELECT 1") == 1:
                          await conn.close()
                          return
                      await conn.close()
                  except Exception as exc:
                      last_error = exc
                  await asyncio.sleep(1)
              raise SystemExit(f"PostgreSQL service was not ready: {last_error}")

          asyncio.run(main())
          PY
      - name: Resolve isolated frontend database
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from backend.tests.migration_isolation_helpers import (
              assert_safe_isolated_db_name,
              resolve_isolated_db_name,
          )
          name = resolve_isolated_db_name(
              os.environ["GITHUB_RUN_ID"],
              os.environ["GITHUB_RUN_ATTEMPT"],
              os.environ["ISOLATED_JOB_NAME"],
          )
          assert_safe_isolated_db_name(name)
          print(f"ISOLATED_DB_NAME={name}")
          PY
      - name: Create isolated frontend database
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main() -> None:
              database_name = os.environ["ISOLATED_DB_NAME"]
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  if await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1", database_name
                  ):
                      raise SystemExit(f"refusing to overwrite {database_name!r}")
                  await conn.execute(f'CREATE DATABASE "{database_name}"')
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
      - name: Upgrade isolated database
        env:
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:5432/${{ env.ISOLATED_DB_NAME }}
        run: alembic -c backend/alembic.ini upgrade head
      - name: Seed real Trial authority and import mapping
        env:
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:5432/${{ env.ISOLATED_DB_NAME }}
        run: |
          python - <<'PY'
          import asyncio
          from decimal import Decimal
          from datetime import UTC, datetime
          from sqlalchemy import select
          from backend.app.actual_harvest_import.validation_service import (
              create_mapping_registry,
              seal_mapping_registry,
          )
          from backend.app.db.session import AsyncSessionMaker
          from backend.app.models.harvest_state import HarvestStateRun
          from backend.app.models.master_data import Farm, Subfarm
          from backend.app.models.production_plan import FarmSeasonVarietyPlan
          from backend.app.models.trial import CoreForecastMarketablePolicyEntryModel, CoreForecastMarketablePolicyModel
          from backend.tests.forecast_quality.test_persistence import (
              _repair_task9_fixture_for_quality,
              _seed_quality_task10_fixture,
          )
          from backend.tests.integration.test_core_forecast_persistence_postgres import (
              _prepare_default_trial_forecast,
          )

          async def main() -> None:
              async with AsyncSessionMaker() as session:
                  forecast_service, request, forecast_actor = (
                      await _prepare_default_trial_forecast(session)
                  )
                  await _repair_task9_fixture_for_quality(session)
                  forecast = await forecast_service.create_forecast(
                      session,
                      request,
                      forecast_actor,
                  )
                  task9 = await session.scalar(
                      select(HarvestStateRun).where(HarvestStateRun.id == 910001)
                  )
                  if task9 is None or task9.result_hash is None:
                      raise SystemExit("Task 9 fixture did not provide a result hash")
                  await _seed_quality_task10_fixture(
                      session,
                      task9_run_id=910001,
                      task9_result_hash=task9.result_hash,
                      forecast_cutoff_at=forecast.forecast_cutoff_at,
                  )
                  policy = await session.scalar(
                      select(CoreForecastMarketablePolicyModel).where(
                          CoreForecastMarketablePolicyModel.public_policy_hash == "a" * 64
                      )
                  )
                  if policy is None:
                      raise SystemExit("Trial policy fixture did not provide the active policy")
                  session.add_all(
                      [
                          Farm(id=102, name="s2-fixture-farm-west"),
                          Subfarm(id=1201, farm_id=102, name="s2-fixture-west"),
                      ]
                  )
                  await session.flush()
                  session.add(
                      FarmSeasonVarietyPlan(
                          id=3202,
                          farm_id=102,
                          subfarm_id=1201,
                          season_id=2026,
                          variety_id=2102,
                          planted_area_mu=Decimal("8.000000"),
                          expected_yield_kg_per_mu=Decimal("25000.000000"),
                          marketable_rate=Decimal("0.8000000000"),
                          version=1,
                          effective_from=datetime(2026, 1, 1).date(),
                          available_at=datetime(2026, 1, 1).date(),
                          source_type="frontend-e2e",
                          source_name="frontend-e2e",
                          source_version="frontend-e2e-v2",
                          row_hash="c" * 64,
                      )
                  )
                  await session.flush()
                  secondary_policy = CoreForecastMarketablePolicyModel(
                      public_policy_hash="e" * 64,
                      row_set_hash="f" * 64,
                      policy_version=policy.policy_version,
                      season_id=policy.season_id,
                      factory_id=policy.factory_id,
                      source_system=policy.source_system,
                      source_record_key="frontend-e2e-secondary-policy",
                      available_at=policy.available_at,
                      effective_from=policy.effective_from,
                      effective_to=policy.effective_to,
                      status=policy.status,
                  )
                  session.add(secondary_policy)
                  await session.flush()
                  session.add(
                      CoreForecastMarketablePolicyEntryModel(
                          policy_id=secondary_policy.id,
                          farm_id=102,
                          subfarm_id=1201,
                          variety_id=2102,
                          sorting_retention_rate=Decimal("1.000000"),
                          postharvest_retention_rate=Decimal("1.000000"),
                          source_version="frontend-e2e-v2",
                          row_hash="d" * 64,
                      )
                  )
                  await session.commit()
              entries = (
                  {"source_field": "season_code", "source_code": "2026-DEMO",
                   "target_type": "SEASON", "target_business_key": "2026-DEMO"},
                  {"source_field": "farm_code", "source_code": "farm-1",
                   "target_type": "FARM", "target_business_key": "s2-fixture-farm"},
                  {"source_field": "subfarm_or_plot_code", "source_code": "sub-1",
                   "target_type": "SUBFARM", "target_business_key": "s2-fixture-east",
                   "target_parent_business_key": "s2-fixture-farm"},
                  {"source_field": "variety_code", "source_code": "var-1",
                   "target_type": "VARIETY", "target_business_key": "S2-VAR-A"},
              )
              async with AsyncSessionMaker() as session:
                  async with session.begin():
                      await session.run_sync(
                          lambda sync: create_mapping_registry(
                              sync,
                              registry_version="frontend-e2e-registry-v1",
                              source_system="trial-api",
                              mapping_policy_version="frontend-e2e-mapping-v1",
                              entries=entries,
                              now=datetime.now(UTC),
                          )
                      )
                      await session.run_sync(
                          lambda sync: seal_mapping_registry(
                              sync,
                              mapping_policy_version="frontend-e2e-mapping-v1",
                              now=datetime.now(UTC),
                          )
                      )

          asyncio.run(main())
          PY
