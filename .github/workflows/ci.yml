            backend/tests/integration/test_climate_zone_import.py \
            backend/tests/integration/test_daily_facts_analytics.py \
            backend/tests/integration/test_failed_attempts.py \
            backend/tests/integration/test_harvest_state_delivery.py \
            backend/tests/integration/test_harvest_state_persistence.py \
            backend/tests/integration/test_health_ready_postgres.py \
            backend/tests/integration/test_history_import.py \
            backend/tests/integration/test_master_data_api.py \
            backend/tests/integration/test_master_data_constraints.py \
            backend/tests/integration/test_maturity_curve.py \
            backend/tests/integration/test_minimal_input_parameter_inference.py \
            backend/tests/integration/test_production_plans.py \
            backend/tests/integration/test_residual_model_constraints.py \
            backend/tests/integration/test_residual_model_persistence.py \
            backend/tests/integration/test_task9_authority_migration_postgres.py \
            backend/tests/integration/test_task9_authority_request_loader_postgres.py \
            backend/tests/integration/test_task9_authority_resolution_postgres.py \
            backend/tests/integration/test_task9_authority_repository_postgres.py \
            -m "not postgres_concurrency" -q --tb=long \
            --timeout=120 \
            --timeout-method=signal \
            --durations=0 \
            --junitxml=reports/test-results/postgres-domain-1.xml
          status=$?
          if [ "$status" -ne 0 ] && [ -f reports/test-results/postgres-domain-1.xml ]; then
            echo "::group::postgres-domain-1 JUnit XML"
            cat reports/test-results/postgres-domain-1.xml
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload postgres-domain-1 JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
