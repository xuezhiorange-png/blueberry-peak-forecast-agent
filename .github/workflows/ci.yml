          path: reports/test-results/postgres-domain-1.xml
          if-no-files-found: warn

      - name: Drop isolated test database
        # Cleanup is best-effort and cannot mask a test failure. The
        # database remains shared by I5 and Slice B until this final step.
        if: always()
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          POSTGRES_USER: blueberry_app
          POSTGRES_PASSWORD: change-me-in-local-env
        run: |
          set +e
          python - <<'PY'
          import asyncio
          import os
          import sys

          import asyncpg

          isolated_db_name = os.environ["ISOLATED_DB_NAME"]

          async def main() -> None:
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"],
                  port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak",
                  user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  await conn.execute(
                      "SELECT pg_terminate_backend(pid) "
                      "FROM pg_stat_activity "
                      "WHERE datname = $1 AND pid <> pg_backend_pid()",
                      isolated_db_name,
                  )
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1",
                      isolated_db_name,
                  )
                  if not exists:
                      print(f"isolated test database {isolated_db_name!r} does not exist")
                      return
                  await conn.execute(f'DROP DATABASE "{isolated_db_name}"')
                  print(f"dropped isolated test database {isolated_db_name!r}")
              finally:
                  await conn.close()

          try:
              asyncio.run(main())
          except Exception as exc:  # noqa: BLE001
              print(f"::warning::failed to drop isolated test database: {exc}")
              sys.exit(0)
          PY

