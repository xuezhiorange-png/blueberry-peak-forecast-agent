      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install existing Playwright Chromium
        run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Start real backend
        env:
          POSTGRES_DB: ${{ env.ISOLATED_DB_NAME }}
          DATABASE_URL: postgresql+asyncpg://blueberry_app:change-me-in-local-env@localhost:5432/${{ env.ISOLATED_DB_NAME }}
        run: |
          nohup uvicorn backend.app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > /tmp/frontend-e2e-backend.log 2>&1 &
          echo $! > /tmp/frontend-e2e-backend.pid
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("backend did not become ready")
          PY
      - name: Run real browser acceptance
        env:
          VITE_TRIAL_API_PROXY_TARGET: http://127.0.0.1:8000
          FRONTEND_E2E_XLSX_DIR: /tmp
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/test-results/frontend-e2e.xml
        run: |
          mkdir -p frontend/reports/test-results
          npm --prefix frontend run test:e2e -- --workers=1 --reporter=junit
      - name: Upload frontend E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: |
            frontend/reports/test-results/frontend-e2e.xml
            frontend/test-results/**
            frontend/playwright-report/**
            /tmp/frontend-e2e-backend.log
          if-no-files-found: warn
      - name: Stop real backend
        if: always()
        run: |
          if [ -f /tmp/frontend-e2e-backend.pid ]; then
            kill "$(cat /tmp/frontend-e2e-backend.pid)" 2>/dev/null || true
          fi
      - name: Drop isolated frontend database
        if: always()
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg
          from backend.tests.migration_isolation_helpers import (
              assert_safe_isolated_db_name,
              resolve_isolated_db_name,
          )
          async def main() -> None:
              expected = resolve_isolated_db_name(
                  os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"],
                  os.environ["ISOLATED_JOB_NAME"],
              )
              assert_safe_isolated_db_name(expected)
              if os.environ.get("ISOLATED_DB_NAME") != expected:
                  raise SystemExit("isolated database cleanup identity mismatch")
              conn = await asyncpg.connect(
                  host=os.environ["POSTGRES_HOST"], port=int(os.environ["POSTGRES_PORT"]),
                  database="blueberry_peak", user=os.environ["POSTGRES_USER"],
                  password=os.environ["POSTGRES_PASSWORD"],
              )
              try:
                  await conn.execute(
                      "SELECT pg_terminate_backend(pid) FROM pg_stat_activity "
                      "WHERE datname = $1 AND pid <> pg_backend_pid()", expected,
                  )
                  if await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname = $1", expected
                  ):
                      await conn.execute(f'DROP DATABASE "{expected}"')
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
