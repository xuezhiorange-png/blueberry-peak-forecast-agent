      # Runs after pytest (with ``if: always()``) and never fails the
      # workflow: parser failure is caught by ``|| true`` and surfaces
      # as "no JUnit XML found" / "no failed nodeids reported" in the
      # step summary, never as a workflow failure.
      - name: Failed nodeid summary
        if: always()
