[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "blueberry-public-core"
version = "0.0.0"
description = "TD-01G synthetic-only executable core rehearsal, not a release"
requires-python = ">=3.12,<3.13"
dependencies = ["openpyxl==3.1.5", "xlrd==2.0.2"]

[project.scripts]
blueberry-public-core = "backend.app.public_core:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "xlrd", "xlrd.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["backend", "tools"]
